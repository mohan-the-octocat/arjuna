    title: Engineering Manager
    projects: {cymbal-eng-shared: 0.6, cymbal-checkout-dev: 0.2, cymbal-platform-ops: 0.2}
    tiers: [0.10, 0.10, 0.20, 0.50, 0.10]
    categories: {research_docs: 30, understand_code: 28, data_analysis: 12, debug_fix: 6, build_feature: 6, other: 18}
  other:
    count: 8
    title: Tech Writer / Security / TPM
    projects: {cymbal-eng-shared: 1.0}
    tiers: [0.0, 0.12, 0.25, 0.50, 0.13]
    categories: {research_docs: 45, understand_code: 25, devops_infra: 5, data_analysis: 5, other: 20}

pt_share: 0.15            # share of users in the Seattle (PT) team

rollout:
  pilot_share: 0.15        # of users; onboard in the first 10 days
  pilot_roles: [swe_backend, swe_platform, swe_frontend, sre, qa, pm]
  rollout_start_offset: 31 # days after start (1 Aug for a 1 Jul start)
  rollout_span_days: 20
  late_joiner_share: 0.10  # of non-pilot users; onboard during the last 30 days
  pilot_churn_share: 0.35  # of pilot users; go quiet within ~7 weeks
  rollout_churn_share: 0.06

# Client releases (profile versions; dates assumed). Users upgrade after a
# per-user lag; laggards stay on the version they had in mid-July.
client_releases:
  - {version: "2.10.0", date: "2026-06-20", breakdown: false, aux_rate: 0.03}
  - {version: "2.11.0", date: "2026-07-14", breakdown: false, aux_rate: 0.03}
  - {version: "2.12.2", date: "2026-08-04", breakdown: true,  aux_rate: 0.03}
  - {version: "2.13.0", date: "2026-08-18", breakdown: true,  aux_rate: 0.03}
  - {version: "2.15.1", date: "2026-09-01", breakdown: true,  aux_rate: 0.03}
  - {version: "2.16.0", date: "2026-09-15", breakdown: true,  aux_rate: 0.11}   # overhead regression
  - {version: "2.17.0", date: "2026-09-26", breakdown: true,  aux_rate: 0.03}
upgrade_lag:
  fast:    {share: 0.30, days: [0, 2]}
  normal:  {share: 0.60, days: [3, 10]}
  laggard: {share: 0.10}

# Models. labels.model / experience pairs (profile), plus gemini-3.5-flash as
# the deprecated model (assumed; not seen in the reference data).
models:
  current_ga: "2026-09-02"            # gemini-3.8-flash becomes available
  min_client_for_current: "2.15.1"
  deprecated_user_share: 0.04
  tier_pref: {high: 0.65, medium: 0.28, low: 0.07}
  rework:                             # proposal outcome probabilities
    default:                 [0.80, 0.13, 0.07]
    gemini-3.7-flash-medium: [0.58, 0.27, 0.15]   # high-rework story
    gemini-3.5-flash-high:   [0.62, 0.24, 0.14]
    gemini-3.5-flash-medium: [0.60, 0.25, 0.15]

aux:
  model: gemini-3.5-flash-lite        # profile
  worktree_p: 0.25                    # per trajectory
  prompt_echo_p: 0.30                 # per human turn
  compaction_tokens: 190000
  image_p_ui: 0.03                    # per UI trajectory

quota_type: null                      # set from the reference profile

runaways: 3
sensitive:
  human_turn_p: 0.015
  terminal_check_p: 0.03
